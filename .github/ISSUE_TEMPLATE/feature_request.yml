name: Feature request
description: Propose a change. Features start as a SPEC change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Out of scope (will be closed): RF transmission, kinetic/effector tasking, weakening guardrails or
        autonomy limits, production-tenant deployment. See SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change (SPEC sections affected)
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would it be verified?
      description: Tests, scenarios, calibration, live Sandbox checks.
