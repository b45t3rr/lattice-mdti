name: Bug report
description: Something does not work as the SPEC says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** Use the private form described in SECURITY.md.
        Never paste tokens, `.env` contents or Sandbox hostnames.
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [RX (ingestion / red team), ING (Lattice entities), Tier 1 (detection), Tier 2 (decisions), C2 / agent, Tooling / docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Reference the SPEC section if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, scenario files, seeds. A red-team scenario or replay file that reproduces it is ideal.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.1.0 or commit SHA
    validations:
      required: true
