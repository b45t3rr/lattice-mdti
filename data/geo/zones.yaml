# Maritime zone registry (SPEC §6.6.1).
# Geometry files are Marine Regions EEZ v12 features, redistributed UNMODIFIED.
# legal_status / monitored / policy are MDTI configuration, not part of the dataset.
# Hashes are verified at start-up; regenerate with `sha256sum` after any dataset update.
dataset:
  name: Marine Regions World EEZ (Maritime Boundaries Geodatabase)
  version: v12
  license: CC-BY 4.0
  source: https://geo.vliz.be/geoserver/MarineRegions/wfs (layers eez, eez_boundaries)

simplify_tolerance_deg: 0.001   # Douglas–Peucker, ≈ 100 m

# The "mile 200": 200 NM limits towards the high seas of the monitored areas.
outer_limits:
  file: boundaries/outer_limits_200nm.geojson
  sha256: 2b03757d8e249a6dff8e600f35db80ce9aa09a6e7fe64de18ef92e17c37d85c1
  line_ids: [3608, 3610, 3721]   # Argentina 200 NM · Falkland/Malvinas 200 NM · South Georgia & S. Sandwich 200 NM

